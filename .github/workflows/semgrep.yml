name: Semgrep
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Scan for security issues
        run: semgrep scan --config p/default --error --metrics off --exclude public/config.js --exclude public/sw-config.js .
